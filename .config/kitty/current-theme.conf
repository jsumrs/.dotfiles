## name: Seaweed
## blurb: Green-and-cream theme on black with yellow and pink accents.
##        Companion to the seaweed Vim colorscheme.

# ── Basic colours ─────────────────────────────────────────────────────────
foreground              #F2EFEA
background              #000000
selection_foreground    none
selection_background    #243024

# ── Cursor ────────────────────────────────────────────────────────────────
cursor                  #F5D86A
cursor_text_color       #000000

# ── URLs ──────────────────────────────────────────────────────────────────
url_color               #8FB0B3

# ── Window borders ────────────────────────────────────────────────────────
active_border_color     #8EA586
inactive_border_color   #2E3D2E
bell_border_color       #F5D86A
visual_bell_color       #1A231A

# ── Tab bar ───────────────────────────────────────────────────────────────
tab_bar_background      #0E130E
tab_bar_margin_color    #0E130E
active_tab_foreground   #000000
active_tab_background   #8EA586
inactive_tab_foreground #5C7B5B
inactive_tab_background #0E130E

# ── Marks (kitty's highlight marks) ───────────────────────────────────────
mark1_foreground        #000000
mark1_background        #F5D86A
mark2_foreground        #000000
mark2_background        #F7A1BA
mark3_foreground        #000000
mark3_background        #8FB0B3

# ── The 16 terminal colours ───────────────────────────────────────────────
