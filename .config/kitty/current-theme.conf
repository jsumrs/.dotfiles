color2                  #8EA586
color10                 #AABBA4
# yellow (sunlit-shoal)
color3                  #F5D86A
color11                 #F7E28F
# blue (harbour-mist)
color4                  #8FB0B3
color12                 #ABC4C6
# magenta (coral-rose)
color5                  #F7A1BA
color13                 #F9B8CB
# cyan (pine-whisper)
color6                  #B2C7B8
color14                 #C5D5CA
# white (nano-white / almond-cream)
color7                  #F2EFEA
